<div class="container py-5">
    <h1 class="fw-bold mb-4">Каталог инструментов</h1>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for category in categories %}
            <div class="col">
                <a href="{% url 'category_detail' category.slug %}" class="text-decoration-none">
                    <div class="card h-100 shadow-sm border-0 p-3">
                        <div class="card-body text-center">
                            <h5 class="fw-bold text-dark">{{ category.name }}</h5>
                            <p class="text-muted small">{{ category.tools.count }} товаров</p>
                        </div>
                    </div>
                </a>
            </div>
        {% endfor %}
    </div>
</div>
