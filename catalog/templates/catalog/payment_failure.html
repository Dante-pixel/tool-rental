<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ошибка оплаты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-5 shadow border-0 text-center" style="max-width: 500px;">
        <span style="font-size: 4rem;">❌</span>
        <h2 class="fw-bold text-danger mt-3">Ошибка при оплате</h2>
        <p class="text-muted mt-2">К сожалению, транзакция была отклонена банком или отменена. Пожалуйста, проверьте баланс карты или попробуйте выбрать способ "Оформить в WhatsApp".</p>
        <div class="d-flex gap-2 justify-content-center mt-4">
            <a href="/cart/" class="btn btn-secondary">В корзину</a>
            <a href="/" class="btn btn-primary">На главную</a>
        </div>
    </div>
</body>
</html>
